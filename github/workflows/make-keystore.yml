name: Generate Keystore Once

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Keystore and Print Base64
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias universal-ai-key \
            -storepass ApnaStrongPassword123 \
            -keypass ApnaStrongPassword123 \
            -dname "CN=UniversalAI, OU=App, O=UniversalAI, L=Patna, S=Bihar, C=IN"
          echo "=== BASE64 START ==="
          base64 -w 0 release.keystore
          echo ""
          echo "=== BASE64 END ==="
